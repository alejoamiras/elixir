name: Setup headless Presto
description: Install the pinned presto-server release (scripts/run/install-presto-server.sh, digest committed) and put it on PATH

runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: echo "version=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' scripts/run/install-presto-server.sh)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.local/bin/presto-server
        key: presto-server-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.version }}
    - name: Install presto-server ${{ steps.pin.outputs.version }}
      shell: bash
      # The script verifies the archive against the SHA-256 committed beside the version; a cached
      # binary that already reports the version is left alone.
      run: |
        bash scripts/run/install-presto-server.sh "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
