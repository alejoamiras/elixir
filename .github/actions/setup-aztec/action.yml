name: Setup Aztec toolchain
description: Install the aztec CLI version pinned in .aztecrc (aztec-nargo, aztec-txe, bb) and put it on PATH

runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: echo "version=$(tr -d '[:space:]' < .aztecrc)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.aztec/versions/${{ steps.pin.outputs.version }}
        key: aztec-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.version }}-${{ hashFiles('toolchain.lock.json') }}
    - name: Install aztec ${{ steps.pin.outputs.version }}
      shell: bash
      env:
        VERSION: ${{ steps.pin.outputs.version }}
      # The installer is a mutable script: it runs only after its bytes match the pinned hash.
      # scripts/run/toolchain.test.ts then pins what it installed (bb, nargo, WASM).
      run: |
        if [ ! -x "$HOME/.aztec/versions/$VERSION/bin/aztec" ]; then
          url=$(jq -r .installer.url toolchain.lock.json)
          expected=$(jq -r .installer.sha256 toolchain.lock.json)
          curl -fsSL "$url" -o "$RUNNER_TEMP/aztec-install.sh"
          echo "$expected  $RUNNER_TEMP/aztec-install.sh" | sha256sum -c -
          NON_INTERACTIVE=1 bash "$RUNNER_TEMP/aztec-install.sh"
        fi
        echo "$HOME/.aztec/versions/$VERSION/bin" >> "$GITHUB_PATH"
