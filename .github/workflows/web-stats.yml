name: web-stats

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.override.outputs.relevant || steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            relevant:
              - 'packages/web-stats/**'
              - '!packages/web-stats/**/*.md'
              - 'packages/site/**'
              - 'packages/ui/**'
              - 'packages/miner-core/src/**'
              - 'packages/miner-core/scripts/**'
              - 'packages/miner-core/fixtures/**'
              - 'biome.json'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/web-stats.yml'
              - '.github/actions/**'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"

  test:
    name: Lint + typecheck + component tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-bun
      - run: bun run lint
      - run: bun run --cwd packages/web-stats typecheck
      - run: bun run --cwd packages/web-stats test:components
      # The slot table pinned against deriveStorageSlotInMap, and the CSV / metrics on the fixture.
      - run: bun test packages/miner-core/src/reader.test.ts packages/miner-core/src/metrics.test.ts packages/miner-core/src/csv.test.ts
