name: web-miner

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      filters: |
        relevant:
          - 'packages/web-miner/**'
          - '!packages/web-miner/**/*.md'
          - 'packages/miner-core/src/**'
          - 'packages/site/**'
          - 'packages/ui/**'
          - 'yacana.params.json'
          - 'scripts/params-codegen.ts'
          - 'biome.json'
          - 'bunfig.toml'
          - 'tsconfig.json'
          - 'package.json'
          - 'bun.lock'
          - '.github/workflows/web-miner.yml'
          - '.github/actions/**'
          - '.github/workflows/_changes.yml'

  test:
    name: Lint + typecheck + component tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-bun
      - run: bun run lint
      - run: bun run --cwd packages/web-miner typecheck
      - run: bun run test:components
      # The vault, the memory store, withdraw and the lost-race recovery run under bun, not Vitest.
      - run: bun test packages/web-miner
      # The pinned CRS must still be what the CDN serves.
      - run: bun packages/site/scripts/fetch-crs.ts packages/web-miner/public
