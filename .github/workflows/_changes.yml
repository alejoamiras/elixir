# The one `changes` job every PR gate calls: `relevant` is true when the pull request touches the
# caller's paths, and always on a manual dispatch (the caller passes its own filter block).
name: _changes

on:
  workflow_call:
    inputs:
      filters:
        description: The whole dorny/paths-filter YAML, a `relevant` key over globs (`!` excludes).
        required: true
        type: string
    outputs:
      relevant:
        description: Whether the gated jobs should run.
        value: ${{ jobs.changes.outputs.relevant }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.override.outputs.relevant || steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: ${{ inputs.filters }}
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"
