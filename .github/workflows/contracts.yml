name: contracts

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.override.outputs.relevant || steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            relevant:
              - 'packages/contracts/**'
              - '!packages/contracts/**/*.md'
              - 'packages/work-circuit/src/**'
              - 'packages/work-circuit/crates/**'
              - 'packages/work-circuit/fixtures/**'
              - 'packages/miner-core/src/**'
              - 'packages/ui/**'
              - 'packages/web-miner/**'
              - '!packages/web-miner/**/*.md'
              - 'yacana.params.json'
              - 'scripts/params-codegen.ts'
              - '.aztecrc'
              - 'toolchain.lock.json'
              - 'scripts/run/toolchain.test.ts'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/contracts.yml'
              - '.github/actions/**'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"

  test:
    name: Compile + test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-aztec
      # Generated Noir globals and VK copies must match yacana.params.json and the work circuit.
      - run: bun run codegen && git diff --exit-code
      - run: bun run contracts:compile
      - run: bun test scripts/run/toolchain.test.ts
        env:
          YACANA_REQUIRE_TOOLCHAIN: '1'
      - run: bun run contracts:test
      # The only job with the compiled artifacts: build the production web bundle here.
      - run: bun run --cwd packages/web-miner build
