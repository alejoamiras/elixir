name: web-landing

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.override.outputs.relevant || steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            relevant:
              - 'packages/web-landing/**'
              - '!packages/web-landing/**/*.md'
              - 'packages/site/**'
              - 'packages/ui/**'
              - 'packages/miner-core/src/**'
              - 'packages/miner-core/scripts/**'
              - 'packages/miner-core/fixtures/**'
              - 'packages/web-miner/src/demo/**'
              - 'packages/web-miner/src/pinned-crs.ts'
              - 'packages/web-miner/src/shims/**'
              - 'biome.json'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/web-landing.yml'
              - '.github/actions/**'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"

  test:
    name: Lint + typecheck + component tests
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-bun
      - run: bun run lint
      - run: bun run --cwd packages/web-landing typecheck
      - run: bun run --cwd packages/web-landing test:components
      # The site config (launch mode) and the metrics the copy deck and the demo panel compute from.
      - run: bun test packages/site packages/miner-core/src/metrics.test.ts
