name: work-circuit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      relevant: ${{ steps.override.outputs.relevant || steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            relevant:
              - 'packages/work-circuit/**'
              - '!packages/work-circuit/**/*.md'
              - '.aztecrc'
              - 'toolchain.lock.json'
              - 'scripts/run/toolchain.test.ts'
              - 'biome.json'
              - 'bunfig.toml'
              - 'tsconfig.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/work-circuit.yml'
              - '.github/actions/**'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"

  test:
    name: Compile + test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-aztec
      - run: bun run lint
      # The VK is the puzzle: every embedded copy and the layout manifest must match the commit.
      - run: bun run codegen && git diff --exit-code
      - run: bun test scripts/run/toolchain.test.ts packages/work-circuit
        env:
          ELIXIR_REQUIRE_TOOLCHAIN: '1'
