      - generic [ref=e98]:
        - generic [ref=e99]:
          - paragraph [ref=e100]: A claim writes a nullifier, a note hash and a counter; a key’s first claim adds Aztec’s delivery handshake, which someone who already knows that address can match. Not the recipient, not the secret, not how many proofs it took.
          - paragraph [ref=e101]: "Holding and spending it: a private transfer is nullifiers and note hashes with the amounts hidden; a public withdraw shows its amount and address, which is why it is a choice. On testnet the sponsor pays the fee, so not even the payer is you; on mainnet a private fee path is the roadmap, and the page will say which it is."
