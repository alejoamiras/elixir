      - heading "How it works" [level=2] [ref=e111]
      - list [ref=e112]:
        - listitem [ref=e113]:
          - paragraph [ref=e114]: 1 · prove
          - heading "Your browser proves a fixed circuit" [level=3] [ref=e115]
          - paragraph [ref=e116]: A 150k-gate Noir circuit, proved by Barretenberg in WASM, a few seconds each. The work is the proof itself; there is nothing to buy and nothing to install.
        - listitem [ref=e117]:
          - paragraph [ref=e118]: 2 · score
          - heading "The proof gets a score against the bar" [level=3] [ref=e119]
          - paragraph [ref=e120]: Poseidon2 over the whole proof. The bar moves every epoch, by at most ×4, so that 4 claims take about 5 minutes.
        - listitem [ref=e121]:
          - paragraph [ref=e122]: 3 · claim
          - heading "A private transaction verifies it and mints" [level=3] [ref=e123]
          - paragraph [ref=e124]: The claim checks the proof inside a private Aztec function and mints 4 tYACA to a key only you hold. A nullifier makes sure it can be claimed once.
      - 'link "Read the mechanism in full: the docs and the threat model →" [ref=e125] [cursor=pointer]':
        - /url: https://github.com/alejoamiras/elixir#readme
