[install]
# 7 days: a compromised release cannot be pulled in before the ecosystem has noticed it.
minimumReleaseAge = 604800
# Hoisted rather than isolated: Vite's dependency pre-bundler resolves the @aztec packages'
# transitive imports (zod, pino, @aztec/protocol-contracts, …) from the app root, which the
# isolated layout does not provide.
linker = "hoisted"

[install.lockfile]
frozen = false
